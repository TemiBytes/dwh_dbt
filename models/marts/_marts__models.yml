version: 2

models:
  - name: dim_customers
    description: "Customer dimension. One row per current customer. Surrogate key customer_key used as FK in fact_sales."
    columns:
      - name: customer_key
        description: "Surrogate primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_number
        tests:
          - not_null
      - name: gender
        tests:
          - accepted_values:
              values: ['Male', 'Female', 'n/a']
      - name: marital_status
        tests:
          - accepted_values:
              values: ['Single', 'Married', 'n/a']
      - name: country
        tests:
          - not_null

  - name: dim_products
    description: "Product dimension. One row per product_number (current version preferred; most-recently discontinued version used as fallback). Surrogate key product_key used as FK in fact_sales."
    columns:
      - name: product_key
        description: "Surrogate primary key"
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_number
        tests:
          - not_null
      - name: cost
        tests:
          - not_null
      - name: cost_tier
        tests:
          - accepted_values:
              values: ['Low', 'Mid', 'High', 'Premium', 'n/a']

  - name: dim_date
    description: "Date dimension. Generated via dbt_utils.date_spine — no source table. One row per day 2010-2030."
    columns:
      - name: date_key
        description: "Surrogate primary key in YYYYMMDD integer format"
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - unique
          - not_null
      - name: is_weekend
        tests:
          - not_null

  - name: fact_sales
    description: "Sales fact table. Incremental model — merges on sales_key (order_number + product_number). Grain is one row per order line. Joins to dim_customers, dim_products, dim_date via surrogate keys."
    columns:
      - name: sales_key
        description: "Surrogate primary key — unique per order line (order_number + product_number)"
        tests:
          - unique
          - not_null
      - name: order_number
        description: "Natural order identifier — not unique at row grain (one order has many product lines)"
        tests:
          - not_null
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: product_key
        tests:
          - not_null:
              severity: warn
          - relationships:
              to: ref('dim_products')
              field: product_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: sales_amount
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null

  - name: agg_monthly_sales
    description: "Pre-aggregated monthly sales by category, subcategory, and country. Materialized as table for Tableau performance."
    columns:
      - name: order_year
        tests:
          - not_null
      - name: order_month
        tests:
          - not_null
      - name: total_sales
        tests:
          - not_null
      - name: total_orders
        tests:
          - not_null